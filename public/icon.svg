<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kempoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="glowHighlight" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff4d4d" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ef4444" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark phone screen background -->
  <rect width="512" height="512" rx="112" fill="#0c0c0e" />

  <!-- Distinct Red Speech Bubble -->
  <g filter="url(#appShadow)">
    <circle cx="256" cy="245" r="185" fill="url(#kempoRedGrad)" />
    <!-- Speech bubble bottom-left pointer tail -->
    <path d="M 145 345 L 90 415 C 84 422 95 430 102 422 L 195 385 Z" fill="#b91c1c" />
    <circle cx="256" cy="245" r="185" fill="url(#glowHighlight)" />
  </g>

  <!-- Distinct stylized bold 'K' monogram -->
  <!-- Vertical stem -->
  <rect x="180" y="145" width="40" height="200" rx="20" fill="#ffffff" />
  <!-- Upper diagonal arm -->
  <path d="M 215 240 L 320 145 C 328 138 340 148 332 156 L 245 250 Z" fill="#ffffff" />
  <!-- Lower diagonal arm -->
  <path d="M 230 235 L 332 338 C 340 346 328 356 320 348 L 215 255 Z" fill="#ffffff" />
  <!-- Pulse verification dot -->
  <circle cx="340" cy="145" r="18" fill="#ffffff" />
  <circle cx="340" cy="145" r="8" fill="#ef4444" />
</svg>
